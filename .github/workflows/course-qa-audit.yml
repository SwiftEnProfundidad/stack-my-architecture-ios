name: Course QA Audit

on:
  push:
  pull_request:

jobs:
  qa-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run QA audit bundle
        run: ./scripts/run-qa-audit-bundle.sh

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-course-qa-reports
          path: |
            00-informe/AUDITORIA-*.md
            00-informe/AUDITORIA-*.json
          if-no-files-found: warn
